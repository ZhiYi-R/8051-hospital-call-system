name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install SDCC
      run: |
        sudo apt-get update
        sudo apt-get install -y sdcc
    
    - name: Build firmware
      run: make build
    
    - name: Run tests
      run: make test
    
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: Build/mcu-1.hex
