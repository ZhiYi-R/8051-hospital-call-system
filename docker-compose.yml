services:
  test:
    image: debian:latest
    volumes:
      - .:/work
    working_dir: /work
    stdin_open: true
    tty: true
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y sdcc sdcc-ucsim make &&
        make test SDCC=sdcc UCSIM=ucsim_51 &&
        bash
      "
